<nav class="bg-white border-b border-gray-200 shadow-sm select-none">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Left side: Logo & Selectors -->
      <div class="flex items-center gap-6">
        <!-- Logo -->
        <div class="shrink-0">
          <a
            routerLink="/"
            class="inline-block px-3 py-1.5 bg-green-200 text-gray-900 font-extrabold rounded-xl text-sm tracking-wide shadow-sm hover:bg-green-300 transition-colors"
          >
            HomeBudget
          </a>
        </div>

        <!-- Custom Selectors -->
        <div class="flex items-center gap-2">
          
          <!-- Selector de Idioma -->
          <div class="relative">
            <button 
              type="button"
              (click)="toggleLang()"
              class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 border border-gray-200 hover:bg-gray-100 hover:border-gray-300 rounded-xl text-xs font-bold text-gray-700 transition-all shadow-sm focus:outline-none"
            >
              @if (configService.language() === 'es') {
                <svg class="w-4 h-3 rounded-sm object-cover shadow-sm" viewBox="0 0 3 2">
                  <rect width="3" height="2" fill="#AD1519" />
                  <rect y="0.5" width="3" height="1" fill="#FABD00" />
                </svg>
                <span>ES</span>
              } @else {
                <svg class="w-4 h-3 rounded-sm object-cover shadow-sm" viewBox="0 0 60 30">
                  <rect width="60" height="30" fill="#012169"/>
                  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/>
                  <path d="M30,0 L30,30 M0,15 L60,15" stroke="#fff" stroke-width="10"/>
                  <path d="M30,0 L30,30 M0,15 L60,15" stroke="#C8102E" stroke-width="6"/>
                </svg>
                <span>EN</span>
              }
              <svg 
                class="w-3 h-3 text-gray-400 transition-transform duration-200" 
                [class.rotate-180]="isLangOpen()" 
                fill="none" 
                stroke="currentColor" 
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            @if (isLangOpen()) {
              <div class="absolute left-0 mt-1.5 w-36 bg-white border border-gray-150 rounded-xl shadow-lg py-1.5 z-50 animate-scale-up">
                <button 
                  type="button"
                  (click)="selectLanguage('es')"
                  [class.bg-green-50]="configService.language() === 'es'"
                  class="flex items-center gap-2.5 w-full px-3 py-2 text-left text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
                >
                  <svg class="w-4 h-3 rounded-sm object-cover shadow-sm" viewBox="0 0 3 2">
                    <rect width="3" height="2" fill="#AD1519" />
                    <rect y="0.5" width="3" height="1" fill="#FABD00" />
                  </svg>
                  <span>Español (ES)</span>
                  @if (configService.language() === 'es') {
                    <span class="ml-auto text-green-600 font-bold">✓</span>
                  }
                </button>
                <button 
                  type="button"
                  (click)="selectLanguage('en')"
                  [class.bg-green-50]="configService.language() === 'en'"
                  class="flex items-center gap-2.5 w-full px-3 py-2 text-left text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
                >
                  <svg class="w-4 h-3 rounded-sm object-cover shadow-sm" viewBox="0 0 60 30">
                    <rect width="60" height="30" fill="#012169"/>
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/>
                    <path d="M30,0 L30,30 M0,15 L60,15" stroke="#fff" stroke-width="10"/>
                    <path d="M30,0 L30,30 M0,15 L60,15" stroke="#C8102E" stroke-width="6"/>
                  </svg>
                  <span>English (EN)</span>
                  @if (configService.language() === 'en') {
                    <span class="ml-auto text-green-600 font-bold">✓</span>
                  }
                </button>
              </div>
            }
          </div>

          <!-- Selector de Moneda -->
          <div class="relative">
            <button 
              type="button"
              (click)="toggleCurr()"
              class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 border border-gray-200 hover:bg-gray-100 hover:border-gray-300 rounded-xl text-xs font-bold text-gray-700 transition-all shadow-sm focus:outline-none"
            >
              @if (configService.currency() === 'EUR') {
                <span class="flex items-center justify-center w-4 h-4 bg-blue-100 text-blue-700 rounded-full text-[10px] font-extrabold font-mono">€</span>
                <span>EUR</span>
              } @else if (configService.currency() === 'USD') {
                <span class="flex items-center justify-center w-4 h-4 bg-emerald-100 text-emerald-700 rounded-full text-[10px] font-extrabold font-mono">$</span>
                <span>USD</span>
              } @else {
                <span class="flex items-center justify-center w-4 h-4 bg-purple-100 text-purple-700 rounded-full text-[10px] font-extrabold font-mono">£</span>
                <span>GBP</span>
              }
              <svg 
                class="w-3 h-3 text-gray-400 transition-transform duration-200" 
                [class.rotate-180]="isCurrOpen()" 
                fill="none" 
                stroke="currentColor" 
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            @if (isCurrOpen()) {
              <div class="absolute left-0 mt-1.5 w-40 bg-white border border-gray-150 rounded-xl shadow-lg py-1.5 z-50 animate-scale-up">
                <button 
                  type="button"
                  (click)="selectCurrency('EUR')"
                  [class.bg-green-50]="configService.currency() === 'EUR'"
                  class="flex items-center gap-2.5 w-full px-3 py-2 text-left text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
                >
                  <span class="flex items-center justify-center w-5 h-5 bg-blue-100 text-blue-700 rounded-full text-xs font-bold font-mono">€</span>
                  <span>Euro (EUR)</span>
                  @if (configService.currency() === 'EUR') {
                    <span class="ml-auto text-green-600 font-bold">✓</span>
                  }
                </button>
                <button 
                  type="button"
                  (click)="selectCurrency('USD')"
                  [class.bg-green-50]="configService.currency() === 'USD'"
                  class="flex items-center gap-2.5 w-full px-3 py-2 text-left text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
                >
                  <span class="flex items-center justify-center w-5 h-5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold font-mono">$</span>
                  <span>Dollar (USD)</span>
                  @if (configService.currency() === 'USD') {
                    <span class="ml-auto text-green-600 font-bold">✓</span>
                  }
                </button>
                <button 
                  type="button"
                  (click)="selectCurrency('GBP')"
                  [class.bg-green-50]="configService.currency() === 'GBP'"
                  class="flex items-center gap-2.5 w-full px-3 py-2 text-left text-xs font-semibold text-gray-700 hover:bg-gray-50 transition-colors"
                >
                  <span class="flex items-center justify-center w-5 h-5 bg-purple-100 text-purple-700 rounded-full text-xs font-bold font-mono">£</span>
                  <span>Pound (GBP)</span>
                  @if (configService.currency() === 'GBP') {
                    <span class="ml-auto text-green-600 font-bold">✓</span>
                  }
                </button>
              </div>
            }
          </div>

        </div>
      </div>

      <!-- Right side: Navigation Links (Swapped!) -->
      <div class="flex items-center">
        <div class="flex space-x-6">
          <a
            routerLink="/dashboard"
            routerLinkActive="border-b-2 border-green-500 text-gray-900 font-semibold"
            class="text-gray-600 hover:text-gray-900 px-1 py-5 text-sm font-medium transition-all"
          >
            {{ 'NAV_TRANSACTIONS' | translate }}
          </a>
          <a
            routerLink="/overview"
            routerLinkActive="border-b-2 border-green-500 text-gray-900 font-semibold"
            class="text-gray-600 hover:text-gray-900 px-1 py-5 text-sm font-medium transition-all"
          >
            {{ 'NAV_RESUMEN' | translate }}
          </a>
          <a
            routerLink="/categories"
            routerLinkActive="border-b-2 border-green-500 text-gray-900 font-semibold"
            class="text-gray-600 hover:text-gray-900 px-1 py-5 text-sm font-medium transition-all"
          >
            {{ 'NAV_CATEGORIES' | translate }}
          </a>
        </div>
      </div>

    </div>
  </div>
</nav>
