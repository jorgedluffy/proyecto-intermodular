@if (isOpen) {
  <div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md">
      <h2 class="text-xl font-bold text-gray-900 mb-4">
        {{ categoryToEdit ? 'Edit Category' : 'Add Category' }}
      </h2>
      
      <form [formGroup]="categoryForm" (ngSubmit)="onSave()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input 
            type="text" 
            formControlName="nombre"
            class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
            placeholder="Ej. Comida"
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
          <textarea 
            formControlName="descripcion"
            rows="3"
            class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full resize-none"
            placeholder="Descripción opcional"
          ></textarea>
        </div>

        <div class="flex items-center gap-4">
          <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
            <div class="flex items-center gap-2">
              <input 
                type="color" 
                formControlName="color"
                class="w-10 h-10 p-0 border-0 rounded cursor-pointer"
              />
              <span class="text-sm text-gray-500 uppercase">{{ categoryForm.get('color')?.value }}</span>
            </div>
          </div>
          
          <div class="flex items-center gap-2 mt-6">
            <input 
              type="checkbox" 
              formControlName="activo"
              id="activo-checkbox"
              class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500"
            />
            <label for="activo-checkbox" class="text-sm font-medium text-gray-700">Activo</label>
          </div>
        </div>

        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
          <button 
            type="button" 
            (click)="onClose()"
            class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded hover:bg-gray-200 transition-colors"
          >
            Cancelar
          </button>
          <button 
            type="submit" 
            [disabled]="categoryForm.invalid"
            class="px-4 py-2 bg-green-200 text-gray-900 text-sm font-medium rounded hover:bg-green-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
}
