@if (isOpen) {
  <div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md my-8">
      <h2 class="text-xl font-bold text-gray-900 mb-4">
        {{ expenseToEdit ? 'Edit Transaction' : 'Add Transaction' }}
      </h2>
      
      <form [formGroup]="expenseForm" (ngSubmit)="onSave()" class="space-y-4">
        
        <!-- Fecha y Tipo -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
            <input 
              type="date" 
              formControlName="fecha"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
            <select 
              formControlName="tipo"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
            >
              <option value="Gasto">Gasto</option>
              <option value="Ingreso">Ingreso</option>
            </select>
          </div>
        </div>

        <!-- Concepto y Cantidad -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Concepto</label>
            <input 
              type="text" 
              formControlName="descripcion"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
              placeholder="Ej. Supermercado"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
            <input 
              type="number" 
              step="0.01"
              formControlName="cantidad"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
              placeholder="0.00"
            />
          </div>
        </div>

        <!-- Categoría y Source -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
            <select 
              formControlName="categoria"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
            >
              <option value="" disabled>Selecciona categoría</option>
              @for (cat of categories; track cat._id) {
                <option [value]="cat._id">{{ cat.nombre }}</option>
              }
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fuente</label>
            <input 
              type="text" 
              formControlName="source"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
              placeholder="Ej. Tarjeta/Efectivo"
            />
          </div>
        </div>
        
        <!-- Nota -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nota</label>
          <textarea 
            formControlName="nota"
            rows="2"
            class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full resize-none"
            placeholder="Detalles adicionales"
          ></textarea>
        </div>

        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
          <button 
            type="button" 
            (click)="onClose()"
            class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded hover:bg-gray-200 transition-colors"
          >
            Cancelar
          </button>
          <button 
            type="submit" 
            [disabled]="expenseForm.invalid"
            class="px-4 py-2 bg-green-200 text-gray-900 text-sm font-medium rounded hover:bg-green-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
}
