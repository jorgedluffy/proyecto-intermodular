@if (isOpen) {
  <div (click)="onClose()" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 animate-fade-in">
    <div (click)="$event.stopPropagation()" class="bg-white rounded-xl shadow-lg p-6 w-full max-w-lg animate-scale-up">
      <h2 class="text-xl font-bold text-gray-900 mb-4">
        {{ expenseToEdit ? ('MODAL_EDIT_TRANSACTION' | translate) : ('MODAL_ADD_TRANSACTION' | translate) }}
      </h2>

      <form [formGroup]="expenseForm" (ngSubmit)="onSave()" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'INPUT_DATE' | translate }}</label>
            <input 
              type="date" 
              formControlName="fecha"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'INPUT_TYPE' | translate }}</label>
            <select 
              formControlName="tipo"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
            >
              <option value="Gasto">{{ 'LABEL_EXPENSE' | translate }}</option>
              <option value="Ingreso">{{ 'LABEL_INCOME' | translate }}</option>
            </select>
          </div>

        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'INPUT_CONCEPT' | translate }}</label>
          <input 
            type="text" 
            formControlName="descripcion"
            class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
            placeholder="Ej. Compra semanal"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'INPUT_AMOUNT' | translate }}</label>
            <input 
              type="number" 
              step="0.01"
              formControlName="cantidad"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
              placeholder="0.00"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'INPUT_CATEGORY' | translate }}</label>
            <select 
              formControlName="categoria"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
            >
              <option value="" disabled>{{ 'LABEL_SELECT_CATEGORY' | translate }}</option>
              @for (cat of categories; track cat._id) {
                @if (cat.activo) {
                  <option [value]="cat._id">{{ cat.nombre }}</option>
                }
              }
            </select>
          </div>

        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'INPUT_SOURCE' | translate }}</label>
            <input 
              type="text" 
              formControlName="source"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
              [placeholder]="'LABEL_SOURCE_PLACEHOLDER' | translate"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'LABEL_NOTE' | translate }}</label>
            <input 
              type="text" 
              formControlName="nota"
              class="px-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400 w-full"
              [placeholder]="'LABEL_NOTE_PLACEHOLDER' | translate"
            />
          </div>

        </div>

        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
          <button 
            type="button" 
            (click)="onClose()"
            class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded hover:bg-gray-200 transition-colors"
          >
            {{ 'BUTTON_CANCEL' | translate }}
          </button>
          <button 
            type="submit" 
            [disabled]="expenseForm.invalid"
            class="px-4 py-2 bg-green-200 text-gray-900 text-sm font-medium rounded hover:bg-green-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ 'BUTTON_SAVE' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
